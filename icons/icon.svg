<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyan)" stroke-width="6" stroke-dasharray="16 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8"/>

  <!-- Central Crest / Crystal (EVOLVE Octagon / Gem) -->
  <g filter="url(#glow)">
    <!-- Gem Polygon -->
    <polygon points="256,96 348,160 368,256 320,360 256,416 192,360 144,256 164,160" 
             fill="url(#purple)" opacity="0.85"/>
    <polygon points="256,120 330,172 346,256 306,344 256,390 206,344 166,256 182,172" 
             fill="url(#cyan)" opacity="0.4"/>
    
    <!-- Evolve Core Wings / Swords -->
    <path d="M256 130 L275 220 L360 240 L285 275 L295 365 L256 300 L217 365 L227 275 L152 240 L237 220 Z" 
          fill="url(#gold)"/>
    
    <!-- Central Evolve Orb -->
    <circle cx="256" cy="256" r="38" fill="#ffffff" opacity="0.9"/>
    <circle cx="256" cy="256" r="28" fill="url(#cyan)"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  </g>

  <!-- Corner Runes -->
  <circle cx="120" cy="120" r="12" fill="url(#gold)" opacity="0.7"/>
  <circle cx="392" cy="120" r="12" fill="url(#gold)" opacity="0.7"/>
  <circle cx="120" cy="392" r="12" fill="url(#gold)" opacity="0.7"/>
  <circle cx="392" cy="392" r="12" fill="url(#gold)" opacity="0.7"/>
</svg>
